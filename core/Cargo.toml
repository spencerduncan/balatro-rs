[package]
name = "balatro-rs"
version = "0.0.1"
edition = "2021"
description = "Game engine and move generator for simplified version of balatro"
license = "MIT"
repository ="https://github.com/evanofslack/balatro-rs"
keywords = ["balatro", "game-engine", "move-generator"]

[dependencies]
anyhow = "~1.0"
colored = {version = "2.2.0", optional = true}
indexmap = "2.6.0"
itertools = "0.13.0"
once_cell = "1.20"
pyo3 = {version = "0.24.1", optional = true, features = ["auto-initialize"]}
rand = "~0.8.5"
regex = { version = "~1.10.2", optional = true }
rand_chacha = "~0.3.1"
serde = { version = "~1.0.215", optional = true, features = ["derive"] }
serde_json = { version = "~1.0.118", optional = true }
toml = { version = "~0.8.12", optional = true }
strum = { version = "0.26", features = ["derive"] }
thiserror = "~1.0.61"
tracing = { version = "~0.1.40", optional = true}
uuid  = {version = "1.17.0", optional = true, features = ["v7"]}

# Infrastructure Foundation Dependencies (Sprint 1)
# High-performance HTTP server and WebSocket support
axum = { version = "0.8", optional = true, features = ["ws", "tokio"] }
tokio = { version = "1.40", optional = true, features = ["full"] }
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

# Zero-copy serialization and concurrent data structures
bincode = { version = "1.3", optional = true }
dashmap = { version = "6.1", optional = true }
bytes = { version = "1.8", optional = true }

# Performance monitoring and metrics
metrics = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# Memory management optimizations
arc-swap = { version = "1.7", optional = true }

# Additional infrastructure dependencies
chrono = { version = "0.4", optional = true, features = ["serde"] }
socket2 = { version = "0.5", optional = true }
serde_bytes = { version = "0.11", optional = true }

[dev-dependencies]
criterion = "0.6.0"
axum-test = "18.0.0-rc3"  # For testing HTTP endpoints

[features]
default = ["serde", "python"]
python = ["dep:pyo3"]
statistical_tests = []  # Enable slow/flaky statistical tests (disabled in CI)
integration_tests = []  # Enable slow integration tests (disabled in CI)
disabled-for-emergency = []  # Temporarily disabled tests with API mismatches
serde = ["dep:serde", "dep:serde_json", "dep:toml", "dep:regex", "dep:uuid", "uuid?/serde"]
colored = ["dep:colored"]

# Infrastructure Foundation Features (Sprint 1)
infrastructure = [
    "dep:axum", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util",
    "dep:bincode", "dep:dashmap", "dep:bytes", "dep:arc-swap",
    "dep:metrics", "dep:metrics-exporter-prometheus", "dep:tracing-subscriber",
    "dep:chrono", "dep:socket2", "dep:serde_bytes", "dep:uuid",
    "http-server", "websockets", "zero-copy", "monitoring", "concurrent"
]
# Individual infrastructure components for fine-grained control
http-server = ["dep:axum", "dep:tokio"]
websockets = ["dep:tokio-tungstenite", "dep:futures-util"]
zero-copy = ["dep:bincode", "dep:bytes"]
monitoring = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:tracing-subscriber"]
concurrent = ["dep:dashmap", "dep:arc-swap"]

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "state_benchmark"
harness = false

[[bench]]
name = "actionspace_benchmark"
harness = false


[[bench]]
name = "effect_processor_benchmark"
harness = false

[[bench]]
name = "effect_processor_benchmark_simple"
harness = false

[[bench]]
name = "effect_processor_benchmark_minimal"
harness = false

[[bench]]
name = "trait_benchmark"
harness = false

[[bench]]
name = "trait_performance"
harness = false
